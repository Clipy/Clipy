name: Agent bridge

on:
  push:
    paths:
      - 'Tools/AgentBridge/**'
      - '.github/workflows/agent-bridge.yml'
  pull_request:
    paths:
      - 'Tools/AgentBridge/**'
      - '.github/workflows/agent-bridge.yml'

permissions:
  contents: read

jobs:
  test-agent-bridge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - run: python3 -m unittest discover -s Tools/AgentBridge -p 'test_*.py' -v
