name: Agent bridge

on:
  push:
    paths:
      - 'Tools/AgentBridge/**'
      - '.github/workflows/agent-bridge.yml'
  pull_request:
    paths:
      - 'Tools/AgentBridge/**'
      - '.github/workflows/agent-bridge.yml'

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-agent-bridge:
    name: Test agent bridge
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - run: python3 -m unittest discover -s Tools/AgentBridge -p 'test_*.py' -v
