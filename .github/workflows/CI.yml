name: CI

on: [push, pull_request]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DEVELOPER_DIR: /Applications/Xcode_26.5.app/Contents/Developer

jobs:
  test:
    # branch protection requires the "test" status check; keep this name in sync
    name: test
    runs-on: macos-26
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      with:
        persist-credentials: false

    - name: Cache Swift packages
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: .spm-cache
        key: spm-${{ runner.os }}-${{ hashFiles('**/Package.resolved') }}
        restore-keys: |
          spm-${{ runner.os }}-

    - name: Run tests
      run: |
        xcodebuild \
          CODE_SIGN_IDENTITY=- \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGNING_ALLOWED=NO \
          -scheme Clipy \
          -project Clipy.xcodeproj \
          -clonedSourcePackagesDirPath "$GITHUB_WORKSPACE/.spm-cache/SourcePackages" \
          -packageCachePath "$GITHUB_WORKSPACE/.spm-cache/PackageCache" \
          -skipPackagePluginValidation \
          -skipMacroValidation \
          clean test

    - name: Verify Apple Silicon build
      run: |
        xcodebuild \
          CODE_SIGN_IDENTITY=- \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGNING_ALLOWED=NO \
          ARCHS=arm64 \
          ONLY_ACTIVE_ARCH=NO \
          -scheme Clipy \
          -project Clipy.xcodeproj \
          -configuration Release \
          -derivedDataPath "$GITHUB_WORKSPACE/build" \
          -clonedSourcePackagesDirPath "$GITHUB_WORKSPACE/.spm-cache/SourcePackages" \
          -packageCachePath "$GITHUB_WORKSPACE/.spm-cache/PackageCache" \
          -skipPackagePluginValidation \
          -skipMacroValidation \
          clean build

        binary="$GITHUB_WORKSPACE/build/Build/Products/Release/Clipy.app/Contents/MacOS/Clipy"
        lipo "$binary" -verify_arch arm64
