name: CodeQL

on:
  push:
    branches: ["develop", "master"]
  pull_request:
    branches: ["develop", "master"]
  schedule:
    - cron: '0 9 * * 0'

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-actions:
    name: Analyze (actions)
    runs-on: ubuntu-latest

    permissions:
      security-events: write # required to upload CodeQL analysis results
      contents: read

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Initialize CodeQL
      uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
      with:
        languages: actions
        build-mode: none

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
      with:
        category: "/language:actions"

  analyze-swift:
    name: Analyze (swift)
    
    # CodeQL's Swift build tracer does not support macOS 27 or Xcode 27 yet.
    # https://github.com/github/codeql/issues/22742
    # Building the current project requires Xcode 27 or later.
    if: ${{ !always() }}
    runs-on: xcode-27
    
    permissions:
      security-events: write # required to upload CodeQL analysis results
      contents: read

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Cache Swift packages
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: .spm-cache
        key: spm-${{ runner.os }}-${{ hashFiles('**/Package.resolved') }}
        restore-keys: |
          spm-${{ runner.os }}-

    - name: Initialize CodeQL
      uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
      with:
        languages: swift
        build-mode: manual

    - name: Run manual build steps
      run: |
        /Applications/Xcode_27.0.app/Contents/Developer/usr/bin/xcodebuild \
          CODE_SIGN_IDENTITY="" \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGNING_ALLOWED=NO \
          -project Clipy.xcodeproj \
          -scheme Clipy \
          -clonedSourcePackagesDirPath "$GITHUB_WORKSPACE/.spm-cache/SourcePackages" \
          -packageCachePath "$GITHUB_WORKSPACE/.spm-cache/PackageCache" \
          -skipPackagePluginValidation \
          -skipMacroValidation \
          build

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
      with:
        category: "/language:swift"
